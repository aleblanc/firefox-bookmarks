name: build-fenix
on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC. The check job only lets the build run when a NEW stable
    # Firefox version appears (so most days do nothing). Manual runs always build.
    - cron: '0 6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Decide whether to build (new upstream stable release?)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(curl -sSL https://raw.githubusercontent.com/mozilla-firefox/firefox/release/browser/config/version.txt | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream stable Firefox version: $VERSION"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -> build."; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$VERSION" ]; then echo "empty version -> skip"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists -> nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION -> build."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      # Where AGP looks for the debug keystore (highest-priority lookup, see
      # com.android.prefs.AbstractAndroidLocations). Without it AGP 9.x prefers
      # $XDG_CONFIG_HOME/.android when that folder exists, and GitHub runners set
      # XDG_CONFIG_HOME=/home/runner/.config while `mach bootstrap` (sdkmanager) creates
      # /home/runner/.config/.android -> our keystore in ~/.android was silently ignored
      # and AGP generated a throwaway key on every run (non-updatable APKs).
      ANDROID_USER_HOME: /home/runner/.android
      # SHA-256 of the certificate inside firelex-patch/debug.keystore. The build fails if
      # the produced APK is not signed with it.
      FIRELEX_KEY_SHA256: 3dfc4d036f6b2f017244ca1598f0d7947259adf41f577d667db458a7d055764b
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true


      - name: Checkout upstream STABLE (release)
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: release
          fetch-depth: 300
          filter: 'blob:none'

      # Recupere firelex-patch/ (overlay + patches + XPIs) depuis CE repo, dans un
      # sous-dossier, sans re-cloner tout Firefox (sparse checkout, depth 1).
      - name: Checkout firelex-patch overlay
        uses: actions/checkout@v4
        with:
          path: _firelex
          sparse-checkout: firelex-patch

      - run: df -h

      - name: Write mozconfig
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --enable-artifact-builds
          ac_add_options --target=aarch64
          mk_add_options MOZ_OBJDIR=./objdir
          EOF
          cat mozconfig

      # Applique l'overlay sur l'arbre upstream (= $GITHUB_WORKSPACE). Echoue
      # bruyamment si un patch ne s'applique pas (signal de rebase).
      - name: Apply firelex-patch
        run: _firelex/firelex-patch/apply.sh "$GITHUB_WORKSPACE"

      # Stable debug keystore (default AGP debug creds: alias androiddebugkey / android)
      # so every build is signed with the SAME key -> APKs install as updates across
      # versions instead of requiring an uninstall. Fenix's debug build type uses AGP's
      # implicit signingConfigs.debug, which reads $ANDROID_USER_HOME/debug.keystore.
      - name: Use a stable debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_USER_HOME"
          cp _firelex/firelex-patch/debug.keystore "$ANDROID_USER_HOME/debug.keystore"
          echo "=== keystore installed at $ANDROID_USER_HOME/debug.keystore ==="
          ls -la "$ANDROID_USER_HOME"
          keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android | grep -E "Alias name|SHA256:"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Cache ~/.mozbuild (toolchains, SDK, NDK)
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-android-artifact-${{ runner.os }}-v1
          restore-keys: |
            mozbuild-android-artifact-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-fenix-${{ runner.os }}-v1
          restore-keys: |
            gradle-fenix-${{ runner.os }}-


      # ⚠️ "Artifact Mode" = télécharge Gecko précompilé (PAS de compilation C++).
      # Sans "Artifact Mode", il compile tout le moteur -> impossible sur runner gratuit.
      - name: mach bootstrap (ARTIFACT MODE)
        run: python3 ./mach --no-interactive bootstrap --application-choice='GeckoView/Firefox for Android Artifact Mode'

      - run: df -h

      # Configure d'abord, puis on FORCE le download de l'artifact Gecko.
      # Si ca echoue ici, c'est net et rapide (pas 29 min de compilation).
      - name: mach configure
        run: python3 ./mach configure

      - name: Download prebuilt GeckoView (fail fast)
        run: python3 ./mach artifact install

      - name: mach build (artifact)
        run: python3 ./mach build

      # Debug dump: which ".android" folders exist right before Gradle signs the APK.
      # If /home/runner/.config/.android shows up here, that is the folder AGP would
      # have picked without ANDROID_USER_HOME.
      - name: Dump signing environment (debug)
        run: |
          echo "=== env ==="
          env | grep -E '^(HOME|XDG_|ANDROID_|TEST_TMPDIR|JAVA_HOME)' | sort || true
          echo "=== version files ==="
          echo "browser/config/version.txt : $(cat browser/config/version.txt)"
          echo "mobile/android/version.txt : $(cat mobile/android/version.txt)"
          for d in "$ANDROID_USER_HOME" "$HOME/.android" "${XDG_CONFIG_HOME:-$HOME/.config}/.android"; do
            echo "=== $d ==="
            ls -la "$d" 2>/dev/null || echo "(absent)"
          done

      - name: Assemble Fenix debug APK
        run: python3 ./mach gradle fenix:assembleDebug -PbenchmarkTest

      # Fail loudly if the APK is not signed with the committed keystore, and print the
      # versionCode/versionName actually baked into the manifest.
      - name: Verify APK signature and version
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          for apk in objdir/gradle/build/mobile/android/fenix/app/outputs/apk/*/*.apk; do
            echo "=== $apk ==="
            "$BT/aapt2" dump badging "$apk" | grep -E "^package:" || true
            "$BT/apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
            if ! grep -qi "certificate SHA-256 digest: $FIRELEX_KEY_SHA256" /tmp/certs.txt; then
              echo "::error::APK is NOT signed with firelex-patch/debug.keystore (expected SHA-256 $FIRELEX_KEY_SHA256)"
              echo "=== $ANDROID_USER_HOME ==="; ls -la "$ANDROID_USER_HOME" || true
              echo "=== ${XDG_CONFIG_HOME:-$HOME/.config}/.android ==="; ls -la "${XDG_CONFIG_HOME:-$HOME/.config}/.android" || true
              exit 1
            fi
          done

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-debug-apk
          path: objdir/gradle/build/mobile/android/fenix/app/outputs/apk/**/*.apk
          if-no-files-found: warn

      # Firefox and Fenix share the same version number (Fenix = Firefox for Android).
      - name: Read Firefox version
        id: ver
        run: echo "version=$(cat browser/config/version.txt)" >> "$GITHUB_OUTPUT"

      # Creates the release (or updates it if the tag already exists) and attaches the APK.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Firefox Bookmarks ${{ steps.ver.outputs.version }}
          body: >-
            Custom Firefox for Android (arm64) built from mozilla-firefox release
            ${{ steps.ver.outputs.version }}, with the Symfony Bookmarks extension and
            uBlock Origin pre-installed and the dashboard set as the home page.
            Debug-signed APK for sideloading.
          files: objdir/gradle/build/mobile/android/fenix/app/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
